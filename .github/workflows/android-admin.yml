name: Track Car Unified Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "apps/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-admin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unified:
    name: Build one unified Track Car APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unified debug APK
        run: gradle --no-daemon :apps:trackcar-android:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          APK="$(find apps/trackcar-android/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" release/TrackCar.apk
          sha256sum release/TrackCar.apk | tee release/SHA256SUMS.txt

      - name: Upload unified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: track-car-unified-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: track-car-android-latest
          name: Track Car Android - Latest Test Build
          body: |
            Automated DEBUG build for installation testing only.
            Not a production-signed release. Android will ask the user to confirm installation.
            Location tracking requires explicit in-app consent and Android permissions.
          files: |
            release/TrackCar.apk
            release/SHA256SUMS.txt
          prerelease: true
          make_latest: false
          overwrite_files: true
