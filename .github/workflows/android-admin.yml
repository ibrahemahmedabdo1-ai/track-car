name: Track Car Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Admin, Installer and Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build all debug APKs
        run: gradle --no-daemon assembleDebug

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: track-car-android-apks
          path: |
            apps/admin-android/build/outputs/apk/debug/*.apk
            apps/installer-android/build/outputs/apk/debug/*.apk
            apps/agent-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
