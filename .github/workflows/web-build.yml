name: Track Car Web Build

on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js web platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production site
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
